  <!DOCTYPE html>
  <html lang="en">
  <head>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
  </head>
  <body>
    <div class="container">
        <div class ="bg-info text-white text-center border border-warning rounded border-3">
            Buttons in Bootstrap
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-warning">Warning</button>
            <button class="btn btn-info">Info</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-light">Light</button>
            <button class="btn btn-dark">Dark</button>
            <button class="btn btn-info btn-sm">click</button>    
            <button class="btn btn-info btn-sm">click</button>
         
            <a href="#" class="btn btn-info btn-lg">click</a>
            <input type="button" value="send" class="btn btn-info btn-lg">
            <input type="submit" value="login" class="btn btn-info btn-lg">
            <input type="reset" value="send" class="btn btn-warning btn-lg">
            <hr>
            <button class="btn btn-outline-info">click</button>
            <button class="btn btn-outline-primary">click</button>
            <button class="btn btn-outline-danger">click</button>
            <button class="btn btn-outline-success">click</button>
            <button class="btn btn-outline-dark">click</button>
            <button class="btn btn-outline-secondary">click</button>
            <hr>
            <button class="btn btn-primary active">click</button>
            <button class="btn btn-primary disabled">click</button>
        </div>
        <button class="btn btn-primary"><span class="spinner-border spinner-border-sm"></span></button>
        <button class="btn btn-primary"><span class="spinner-border spinner-border-lg"></span></button>
        <button class="btn btn-primary"><span class="spinner-border spinner-border-lg"></span></button>
        <button class="btn btn-primary"><span class="spinner-grow spinner-grow-sm"></span></button>
    </div>
  </body>
  </html>
