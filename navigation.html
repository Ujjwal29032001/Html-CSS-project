<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Navigation bar</title>
    <style>
       body{
         background-color: rgb(136,201,202);
         margin: 0px;

       }
       ul{
        list-style:none;
        margin:0px;
        padding:0px;
        background-color: rgb(24,86,71)
       }
       li{
        float:left;
       }
       li a{
        display: block;
        color:rgb(0,0,0);
        padding: 40px 16px;
        text-decoration: none;
        font-size:larger;
        
       }
    </style>
</head>
<body>
    <ul>
        <li><a href="">Intro </a></li>
        <li><a href="">Menu</a></li>
        <li><a href="">About </a></li>
        <li><a href="">Contact</a></li>
    </ul>
</body>
</html>
