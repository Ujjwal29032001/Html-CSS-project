<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navigation Bar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: blue;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .navbar {
            background-color: #333;
            width: 100%;
            position: fixed;
            top: 0;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 10px;
            height: 60px; /* Adjust height as needed */
        }
        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .navbar li {
            margin-left: 20px;
        }
        .navbar li a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-size: larger;
        }
        .navbar li a:hover {
            background-color: #111;
        }
        .codeBetter {
            color: pink;
            text-align: center;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">Courses</a></li>
            <li><a href="">Articles</a></li>
            <li><a href="">About Us</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </div>
    <div class="codeBetter">
        <h1>Welcome to <span style="color: white;">Code</span><span style="color: white;">Better</span></h1>
    </div>
</body>
</html>
