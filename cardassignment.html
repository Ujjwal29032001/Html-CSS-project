<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fixed Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card bg-info mx-auto border border-rounded" style="width: 300px;">
        <div class="card-header text-center border border-rounded">
            <img class="rounded-circle" src="python.jpeg" class="img-fluid">
        </div>
        <div class="card-body text-black text-center">
            <h5 class="card-title">Python Programming</h5>
            <button class="btn btn-danger">View details</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
